services:
  - type: web
    name: vektor-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: BACKEND_HOST
        value: "0.0.0.0"
      - key: DATABASE_URL
        fromDatabase:
          name: vektor-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://your-vercel-app.vercel.app"

databases:
  - name: vektor-db
    plan: free
    databaseName: vektor_db
    user: vektor_user
